function procesarImportVentas(){
  const file = document.getElementById('imp-venta-file').files[0];
  const proyectoVenta = document.getElementById('imp-venta-proy').value;
  const msgEl = document.getElementById('imp-venta-msg');
  if(!file){ msgEl.innerHTML='<div class="alert alert-danger">Seleccioná un archivo primero.</div>'; return; }
  if(!proyectoVenta){ msgEl.innerHTML='<div class="alert alert-danger">Seleccioná el proyecto antes de importar.</div>'; return; }
  msgEl.innerHTML='<div style="color:var(--muted);font-size:13px">Procesando...</div>';

  readExcelFile(file, function(err, rows){
    if(err){ msgEl.innerHTML='<div class="alert alert-danger">'+err+'</div>'; return; }
    if(rows.length < 2){ msgEl.innerHTML='<div class="alert alert-danger">El archivo no tiene datos suficientes.</div>'; return; }

    const headers = rows[0];
    const mesesCols = headers.slice(3).map(h=>String(h).trim());
    const errores = [];
    const nuevasVentas = [];

    rows.slice(1).forEach((row, ri)=>{
      const unidad = String(row[0]||'').trim();
      const comprador = String(row[1]||'').trim();
      const moneda = String(row[2]||'USD').trim().toUpperCase();
      if(!unidad) return;
      if(moneda!=='ARS'&&moneda!=='USD'){ errores.push('Fila '+(ri+2)+': moneda inválida'); return; }

      const cuotas = [];
      let precioTotal = 0;
      let fechaFirma = null;
      mesesCols.forEach((mes, ci)=>{
        if(!/^\d{4}-\d{2}$/.test(mes)) return;
        const raw = row[ci+3];
        const monto = parseFloat(String(raw).replace(/[^0-9.-]/g,''))||0;
        if(monto <= 0) return;
        if(!fechaFirma) fechaFirma = mes;
        precioTotal += monto;
        // Group consecutive identical amounts as recurring cuota
        const last = cuotas[cuotas.length-1];
        if(last && last.monto===monto && last.moneda===moneda && addMonths(last.mes, last.cantidad)===mes){
          last.cantidad++;
        } else {
          cuotas.push({tipo:'Cuota', monto, mes, cantidad:1, moneda, cac:false});
        }
      });

      if(!cuotas.length){ errores.push('Fila '+(ri+2)+' ('+unidad+'): sin cobros válidos'); return; }
      nuevasVentas.push({id:Date.now()+Math.random(),proyecto:proyectoVenta,unidad,comprador:comprador||'Sin especificar',fecha:fechaFirma||todayYM(),precio:precioTotal,moneda,cac:false,obs:'Importado',cuotas});
    });

    if(errores.length > nuevasVentas.length){
      msgEl.innerHTML='<div class="alert alert-danger">'+errores.slice(0,5).join('<br>')+'</div>'; return;
    }
    if(!nuevasVentas.length){ msgEl.innerHTML='<div class="alert alert-danger">No se encontraron ventas válidas.</div>'; return; }

    const preview = document.getElementById('imp-venta-preview');
    preview.innerHTML = `
      <div class="section-hdr"><span class="section-title">Vista previa — ${nuevasVentas.length} ventas</span></div>
      <div class="tbl-wrap" style="max-height:280px;overflow-y:auto">
        <table>
          <thead><tr><th>Unidad</th><th>Comprador</th><th>Moneda</th><th style="text-align:right">Total</th><th>Tramos</th></tr></thead>
          <tbody>${nuevasVentas.map(v=>`<tr>
            <td style="font-weight:500">${v.unidad}</td>
            <td>${v.comprador}</td>
            <td><span class="tag ${v.moneda==='USD'?'tag-usd':'tag-ars'}">${v.moneda}</span></td>
            <td>${fmtMon(v.precio,v.moneda)}</td>
            <td style="color:var(--muted);font-size:11px">${v.cuotas.length} tramo${v.cuotas.length!==1?'s':''}</td>
          </tr>`).join('')}</tbody>
        </table>
      </div>
      ${errores.length?'<div class="alert alert-danger" style="margin-top:8px">Advertencias:<br>'+errores.join('<br>')+'</div>':''}
      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="btn btn-accent" id="btn-confirmar-ventas">✓ Confirmar e importar ${nuevasVentas.length} ventas</button>
        <button class="btn" onclick="document.getElementById('imp-venta-preview').innerHTML=''">Cancelar</button>
      </div>
    `;
    document.getElementById('btn-confirmar-ventas').addEventListener('click', function(){
      confirmarImportVentas(nuevasVentas);
    });
    msgEl.innerHTML='';
  });
}

function confirmarImportVentas(nuevasVentas){
  ventas = ventas.concat(nuevasVentas);
  save('ventas', ventas);
  updateBadges();
  document.getElementById('imp-venta-preview').innerHTML='';

}

function abrirConfigGitHub(){

  document.getElementById('gh-repo-input').value=cfg.repo||'cashflow';

function cargarConfigGH(){
  try{return JSON.parse(localStorage.getItem('cf_gh_config')||'{}');}catch(e){return {};}
}
function guardarConfigGitHub(){
  var token=document.getElementById('gh-token-input').value.trim();
  var user=document.getElementById('gh-user-input').value.trim();
  var repo=document.getElementById('gh-repo-input').value.trim();
  var pwd=document.getElementById('gh-pwd-input').value.trim();
  var msg=document.getElementById('gh-config-msg');
  if(!token||!user||!repo||!pwd){msg.style.color='var(--red)';msg.textContent='Completá todos los campos.';return;}
  if(pwd.length<4){msg.style.color='var(--red)';msg.textContent='Contraseña muy corta (mínimo 4 caracteres).';return;}
  localStorage.setItem('cf_gh_config',JSON.stringify({token:token,user:user,repo:repo,pwd:pwd}));
  msg.style.color='var(--green)';msg.textContent='Configuración guardada.';
  setTimeout(function(){closeModal('modal-github');},1000);
}
function hashPwd(s){var h=0;for(var i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}return h;}

function construirSnapshot(pwd,fecha,hora){
  // Get app script source directly from the DOM — most reliable method
  var appScript = null;
  var scripts = document.querySelectorAll('script:not([src]):not([id])');
  for(var i=0;i<scripts.length;i++){
    if(scripts[i].textContent.indexOf('function renderDashboard')>-1){
      appScript = scripts[i].textContent; break;
    }
  }
  if(!appScript){ alert('Error: no se encontró el script de la app.'); return null; }

  // Rebuild full HTML from the document
  var src = '<!DOCTYPE html>\n<html lang="es">\n';
  src += document.querySelector('head').outerHTML + '\n';
  src += '<body>\n';

  // Inject data as inline script BEFORE the app script
  var dataInject = '<script>\n'
    + '// ── Snapshot data ──\n'
    + 'var __snapVentas   = ' + JSON.stringify(ventas)   + ';\n'
    + 'var __snapStock    = ' + JSON.stringify(stock)    + ';\n'
    + 'var __snapEgresos  = ' + JSON.stringify(egresos)  + ';\n'
    + 'var __snapOtrosIng = ' + JSON.stringify(otrosIng) + ';\n'
    + 'var __snapCaja     = ' + JSON.stringify(caja)     + ';\n'
    + '<\/script>\n';

  // Patch the app script: override load() to return snapshot data
  var patchedScript = appScript
    .replace("let ventas   = load('ventas', demo_ventas());",   "let ventas   = (typeof __snapVentas!=='undefined'   ? __snapVentas   : load('ventas',   demo_ventas()));")
    .replace("let stock    = (typeof __snapStock!=='undefined'    ? __snapStock    : load('stock',    []));",             "let stock    = (typeof __snapStock!=='undefined'    ? __snapStock    : load('stock',    []));")
    .replace("let egresos  = (typeof __snapEgresos!=='undefined'  ? __snapEgresos  : load('egresos',  demo_egresos()));", "let egresos  = (typeof __snapEgresos!=='undefined'  ? __snapEgresos  : load('egresos',  demo_egresos()));")
    .replace("let otrosIng  = load('otrosIng', []);",            "let otrosIng = (typeof __snapOtrosIng!=='undefined' ? __snapOtrosIng : load('otrosIng', []));")
    .replace("let caja      = load('caja', {tc:1200,cuentas:null,historial:[]});", "let caja     = (typeof __snapCaja!=='undefined'     ? __snapCaja     : load('caja',     {tc:1200,cuentas:null,historial:[]}));")
    .replace("function save(k, v){ try{ localStorage.setItem('cf_'+k, JSON.stringify(v)); }catch(e){} }", "function save(k,v){}");

  // Password protection
  var ph = hashPwd(pwd);
  var sc = '<'+'\/script>';
  var login = '<div id="ls" style="position:fixed;inset:0;z-index:99999;background:#0f0f0f;display:flex;align-items:center;justify-content:center">'
    +'<div style="background:#181818;border:1px solid #2e2e2e;border-radius:12px;padding:40px;width:90%;max-width:340px;text-align:center">'
    +'<div style="font-size:28px;margin-bottom:8px">&#x1F4CA;</div>'
    +'<div style="font-size:17px;font-weight:600;color:#f0ede8;margin-bottom:4px">Cashflow</div>'
    +'<div style="font-size:12px;color:#888;margin-bottom:20px">Ingres\u00e1 la contrase\u00f1a</div>'
    +'<input id="pi" type="password" style="width:100%;background:#222;border:1px solid #3a3a3a;border-radius:6px;padding:10px;color:#f0ede8;font-size:14px;outline:none;margin-bottom:8px;box-sizing:border-box" onkeydown="if(event.key===\'Enter\')window.__lck()">'
    +'<div id="pe" style="color:#f06060;font-size:12px;margin-bottom:8px;display:none">Contrase\u00f1a incorrecta</div>'
    +'<button onclick="window.__lck()" style="width:100%;background:#c8f060;color:#0f0f0f;border:none;border-radius:6px;padding:10px;font-size:14px;font-weight:600;cursor:pointer">Entrar</button>'
    +'</div></div>'
    +'<sc'+'ript>'
    +'(function(){var ph='+ph+';'
    +'window.__lck=function(){var v=document.getElementById("pi").value,h=0;'
    +'for(var i=0;i<v.length;i++){h=((h<<5)-h)+v.charCodeAt(i);h|=0;}'
    +'if(h===ph){document.getElementById("ls").remove();sessionStorage.setItem("a","1");'
    +'if(typeof updateBadges==="function"){updateBadges();renderDashboard();}}'
    +'else{document.getElementById("pe").style.display="block";document.getElementById("pi").value="";}};'
    +'if(sessionStorage.getItem("a")==="1"){setTimeout(function(){var s=document.getElementById("ls");if(s)s.remove();},0);}'
    +'else{setTimeout(function(){var i=document.getElementById("pi");if(i)i.focus();},100);}})();'
    +sc;

  var style='<style>#sb{position:fixed;top:0;left:0;right:0;z-index:9998;background:linear-gradient(90deg,#1a3a5c,#1e5a8a);color:#fff;font-size:12px;padding:7px 20px;display:flex;align-items:center;justify-content:space-between;}.sm{opacity:.7;font-size:11px}.app{padding-top:34px!important}#nav-importar,.sidebar-footer .btn,.sidebar-footer input{display:none!important}</style>';
  var banner='<div id="sb"><div><strong>Cashflow</strong><span class="sm"> Solo lectura</span></div><div class="sm">'+fecha+' '+hora+'</div></div>';
  var cleanup='<sc'+'ript>(function(){var sf=document.querySelector(".sidebar-footer");if(sf)sf.innerHTML=\'<div style="font-size:10px;text-align:center;padding:8px;color:#888">Solo lectura</div>\';document.querySelectorAll("button").forEach(function(b){var t=b.textContent.trim();if(t.startsWith("+")||t==="\u270e"||t==="\u2715"||t.includes("Exportar")||t.includes("Backup")||t.includes("Restaurar")||t.includes("Publicar")||t.includes("Configurar")||t.includes("Actualizar saldo")||t.includes("Registrar"))b.style.display="none";});document.querySelectorAll(".modal-overlay").forEach(function(m){m.remove();});})();<'+'/sc'+'ript>';

  // Build xlsx script tag
  var xlsxTag = '<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"><\/script>\n';

  src += style + login + banner + dataInject + xlsxTag
      + '<script>\n' + patchedScript + '\n<\/script>\n'
      + cleanup
      + '\n</body>\n</html>';
  return src;
}


async function publicarEnGitHub(){
  var cfg=cargarConfigGH();
  var st=document.getElementById('gh-status');
  if(!cfg.token||!cfg.user||!cfg.repo||!cfg.pwd){abrirConfigGitHub();return;}
  var fecha=new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'});
  var hora=new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
  st.innerHTML='<span style="color:var(--amber)">Generando...</span>';
  var snap=construirSnapshot(cfg.pwd,fecha,hora);
  if(!snap){st.innerHTML='<span style="color:var(--red)">Error generando snapshot.</span>';return;}
  var b64=btoa(unescape(encodeURIComponent(snap)));
  st.innerHTML='<span style="color:var(--amber)">Conectando...</span>';
  var api='https://api.github.com/repos/'+cfg.user+'/'+cfg.repo+'/contents/index.html';
  var hdrs={'Authorization':'token '+cfg.token,'Content-Type':'application/json','Accept':'application/vnd.github.v3+json'};
  var sha=null;
  try{var r0=await fetch(api,{headers:hdrs});if(r0.ok){var d=await r0.json();sha=d.sha;}}catch(e){}
  st.innerHTML='<span style="color:var(--amber)">Publicando...</span>';
  try{
    var body={message:'Actualización '+fecha+' '+hora,content:b64};
    if(sha)body.sha=sha;
    var res=await fetch(api,{method:'PUT',headers:hdrs,body:JSON.stringify(body)});
    if(res.ok){
      st.innerHTML='<span style="color:var(--green)">&#x2713; Publicado '+hora+'</span><br>'
        +'<a href="https://'+cfg.user+'.github.io/'+cfg.repo+'" target="_blank" style="color:var(--accent);font-size:10px">'+cfg.user+'.github.io/'+cfg.repo+'</a>';
    }else{
      var er=await res.json();
      st.innerHTML='<span style="color:var(--red)">'+(er.message||res.status)+'</span>';
    }
  }catch(e){st.innerHTML='<span style="color:var(--red)">'+e.message+'</span>';}
}

function exportarBackup(){
  var data={v:1,fecha:new Date().toISOString(),ventas:ventas,stock:stock,egresos:egresos,otrosIng:otrosIng,caja:caja};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='cashflow_backup_'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
}
function importarBackup(input){
  var file=input.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=JSON.parse(e.target.result);
      if(!data.v||!data.ventas)throw new Error('Formato inválido');
      if(!confirm('Restaurar backup del '+(data.fecha?data.fecha.slice(0,10):'archivo')+'?\nSe reemplazarán todos los datos actuales.'))return;
      ventas=data.ventas||[];stock=data.stock||[];egresos=data.egresos||[];otrosIng=data.otrosIng||[];
      if(data.caja)caja=data.caja;
      save('ventas',ventas);save('stock',stock);save('egresos',egresos);save('otrosIng',otrosIng);save('caja',caja);
      updateBadges();renderDashboard();
      alert('Backup restaurado correctamente.');
    }catch(err){alert('Error: '+err.message);}
    input.value='';
  };
  reader.readAsText(file);
}
