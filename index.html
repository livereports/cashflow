<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cashflow — Constructora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=DM+Sans:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f0f0f;
  --surface: #181818;
  --surface2: #222222;
  --border: #2e2e2e;
  --border2: #3a3a3a;
  --text: #f0ede8;
  --muted: #888;
  --accent: #c8f060;
  --accent-dim: #9ab840;
  --blue: #60b4f0;
  --red: #f06060;
  --amber: #f0b860;
  --green: #60d098;
  --font: 'DM Sans', sans-serif;
  --mono: 'DM Mono', monospace;
  --radius: 10px;
  --radius-sm: 6px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--surface)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* Layout */
.app{display:grid;grid-template-columns:220px 1fr;height:100vh;overflow:hidden}
.sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
.main{display:flex;flex-direction:column;overflow:hidden}
.content{flex:1;overflow-y:auto;padding:28px 32px}

/* Sidebar */
.sidebar-logo{padding:24px 20px 20px;border-bottom:1px solid var(--border)}
.sidebar-logo .brand{font-size:13px;font-weight:600;color:var(--accent);letter-spacing:0.08em;text-transform:uppercase}
.sidebar-logo .sub{font-size:11px;color:var(--muted);margin-top:2px}
.nav-section{padding:16px 12px 8px;font-size:10px;font-weight:600;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;color:var(--muted);transition:all 0.15s;margin:1px 8px;border:none;background:none;width:calc(100% - 16px);text-align:left}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:rgba(200,240,96,0.12);color:var(--accent)}
.nav-item svg{width:16px;height:16px;flex-shrink:0}
.nav-badge{margin-left:auto;background:var(--surface2);color:var(--muted);font-size:10px;font-family:var(--mono);padding:2px 6px;border-radius:20px}
.nav-item.active .nav-badge{background:rgba(200,240,96,0.2);color:var(--accent)}
.sidebar-footer{margin-top:auto;padding:16px;border-top:1px solid var(--border);font-size:11px;color:var(--muted)}

/* Topbar */
.topbar{padding:16px 32px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--surface);flex-shrink:0}
.topbar-title{font-size:18px;font-weight:500}
.topbar-sub{font-size:12px;color:var(--muted);margin-top:1px}
.topbar-actions{display:flex;gap:8px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:none;color:var(--text);font-family:var(--font);font-size:13px;cursor:pointer;transition:all 0.15s}
.btn:hover{background:var(--surface2);border-color:var(--muted)}
.btn-accent{background:var(--accent);color:#0f0f0f;border-color:var(--accent);font-weight:600}
.btn-accent:hover{background:var(--accent-dim);border-color:var(--accent-dim)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-ghost{border-color:transparent}
.btn-ghost:hover{border-color:var(--border2)}
.btn-danger{color:var(--red);border-color:transparent}
.btn-danger:hover{background:rgba(240,96,96,0.1);border-color:rgba(240,96,96,0.3)}

/* Panels */
.panel{display:none}
.panel.active{display:block}

/* Metric cards */
.metrics-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:24px}
.metric-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px}
.metric-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px}
.metric-val{font-size:22px;font-weight:500;font-family:var(--mono);color:var(--text)}
.metric-val.green{color:var(--green)}
.metric-val.red{color:var(--red)}
.metric-val.amber{color:var(--amber)}
.metric-val.accent{color:var(--accent)}
.metric-sub{font-size:11px;color:var(--muted);margin-top:4px}

/* Section headers */
.section-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;margin-top:24px}
.section-hdr:first-child{margin-top:0}
.section-title{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase}

/* Tables */
.tbl-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:var(--surface2);padding:10px 12px;text-align:left;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:0.05em;text-transform:uppercase;white-space:nowrap;border-bottom:1px solid var(--border)}
thead th:not(:first-child){text-align:right}
tbody td{padding:10px 12px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:rgba(255,255,255,0.02)}
td:not(:first-child){text-align:right;font-family:var(--mono);font-size:12px}
.tbl-total td{background:var(--surface2)!important;font-weight:600;border-top:1px solid var(--border2)}
.tbl-total td:first-child{color:var(--accent)}
.positive{color:var(--green)}
.negative{color:var(--red)}
.zero{color:var(--muted)}

/* Tags / badges */
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500}
.tag-usd{background:rgba(96,180,240,0.15);color:var(--blue)}
.tag-ars{background:rgba(96,208,152,0.15);color:var(--green)}
.tag-cac{background:rgba(240,184,96,0.15);color:var(--amber)}
.tag-stock{background:rgba(200,240,96,0.12);color:var(--accent)}

/* Cards list */
.venta-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:8px;transition:border-color 0.15s}
.venta-card:hover{border-color:var(--border2)}
.venta-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.venta-nombre{font-weight:500;font-size:14px}
.venta-meta{font-size:12px;color:var(--muted);margin-top:2px}
.venta-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.venta-actions{display:flex;gap:4px;flex-shrink:0}

/* Forms */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:500}
.form-group input,.form-group select,.form-group textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;color:var(--text);font-family:var(--font);font-size:13px;outline:none;transition:border-color 0.15s}
.form-group input:focus,.form-group select:focus{border-color:var(--accent)}
.form-group select option{background:var(--surface2)}
.form-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px}
.form-section-title{font-size:13px;font-weight:600;margin-bottom:14px;color:var(--text)}

/* Cuota rows */
.cuota-row{display:grid;grid-template-columns:2fr 1.4fr 1.2fr 0.7fr 0.8fr 0.7fr auto;gap:8px;align-items:end;padding:10px 0;border-bottom:1px solid var(--border)}
.cuota-row:last-child{border-bottom:none}
.cuota-row label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px}
.cuota-row input,.cuota-row select{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 8px;color:var(--text);font-family:var(--font);font-size:12px;width:100%;outline:none}
.cuota-row input:focus,.cuota-row select:focus{border-color:var(--accent)}
.cuota-hdr{display:grid;grid-template-columns:2fr 1.4fr 1.2fr 0.7fr 0.8fr 0.7fr auto;gap:8px;padding:6px 0 4px;font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;border-bottom:1px solid var(--border)}

/* Cashflow table */
.cf-sticky{position:sticky;left:0;background:var(--surface);z-index:2}
.cf-tbl thead th{text-align:center!important}
.cf-tbl thead th:first-child{text-align:left!important}
.cf-tbl td{text-align:right}
.cf-tbl td:first-child{text-align:left}
.cf-section-row td{background:rgba(200,240,96,0.06)!important;font-size:11px;font-weight:600;color:var(--accent);letter-spacing:0.06em;text-transform:uppercase}
.cf-total-row td{background:var(--surface2)!important;font-weight:600;border-top:2px solid var(--border2)}
.cf-net-row td{background:rgba(200,240,96,0.1)!important;font-weight:700;font-size:13px;color:var(--accent)}
.cf-sub-row td{padding-left:24px;font-size:12px}
.cf-saldo-row td{background:rgba(96,180,240,0.08)!important;color:var(--blue);font-weight:600}

/* Stock table */
.stock-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:8px}

/* Bar chart */
.bar-chart{display:flex;align-items:flex-end;gap:4px;height:100px;margin-top:8px}
.bar-item{display:flex;flex-direction:column;align-items:center;flex:1;gap:4px}
.bar-fill{width:100%;border-radius:3px 3px 0 0;min-height:2px;transition:height 0.4s ease}
.bar-lbl{font-size:9px;color:var(--muted);font-family:var(--mono)}

/* Egresos cards */
.egreso-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:8px}
.egreso-top{display:flex;justify-content:space-between;align-items:flex-start}
.egreso-nombre{font-weight:500;font-size:14px}
.egreso-meta{font-size:12px;color:var(--muted);margin-top:2px}
.egreso-monto{font-family:var(--mono);font-size:15px;font-weight:500;color:var(--red)}

/* Tabs */
.sub-tabs{display:flex;gap:2px;margin-bottom:20px;background:var(--surface2);border-radius:var(--radius-sm);padding:3px;width:fit-content}
.sub-tab{padding:6px 14px;border-radius:5px;cursor:pointer;font-size:12px;font-weight:500;color:var(--muted);border:none;background:none;transition:all 0.15s}
.sub-tab.active{background:var(--surface);color:var(--text)}

/* Empty state */
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty svg{margin-bottom:12px;opacity:0.3}
.empty p{font-size:13px}

/* Alerts */
.alert{padding:10px 14px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:12px}
.alert-danger{background:rgba(240,96,96,0.1);border:1px solid rgba(240,96,96,0.3);color:var(--red)}
.alert-success{background:rgba(96,208,152,0.1);border:1px solid rgba(96,208,152,0.3);color:var(--green)}

/* Divider */
.divider{height:1px;background:var(--border);margin:20px 0}

/* Month selector for cashflow */
.period-bar{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.period-bar label{font-size:12px;color:var(--muted)}
.period-bar input,.period-bar select{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 10px;color:var(--text);font-family:var(--font);font-size:13px;outline:none}

/* Modal overlay */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);padding:24px;width:100%;max-width:680px;max-height:85vh;overflow-y:auto}
.modal-title{font-size:17px;font-weight:600;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center}

/* Pill group */
.pill-group{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:4px 12px;border-radius:20px;border:1px solid var(--border2);font-size:12px;cursor:pointer;transition:all 0.15s;background:none;color:var(--muted)}
.pill.active{background:rgba(200,240,96,0.15);border-color:var(--accent);color:var(--accent)}
</style>
</head>

// ─── FORMAT ─────────────────────────────────────────────────────────────────
function fmtN(n){ return Math.round(n).toLocaleString('es-AR'); }
function fmtARS(n){ return '$'+fmtN(n); }
function fmtUSD(n){ return 'U$S '+fmtN(n); }
function fmtMon(n,m){ return m==='USD'?fmtUSD(n):fmtARS(n); }
function ym2label(ym){ if(!ym)return''; const[y,m]=ym.split('-'); return MESES[parseInt(m)-1]+' '+y; }
function todayYM(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function addMonths(ym,n){ let[y,m]=ym.split('-').map(Number); m+=n; while(m>12){m-=12;y++;} while(m<1){m+=12;y--;} return y+'-'+String(m).padStart(2,'0'); }

// ─── OTROS INGRESOS CALC ─────────────────────────────────────────────────────
function calcOtrosIngYM(ym, tc){
  if(!ym||typeof ym!=='string'||!/^\d{4}-\d{2}$/.test(ym)) return {usd:0,ars:0,total_usd:0};
  tc = tc||caja.tc||1200;
  let totalUSD=0, totalARS=0;
  (otrosIng||[]).filter(o=>!filtroProyecto||!o.proyecto||o.proyecto===filtroProyecto).forEach(o=>{
    if(!o.desde) return;
    const[oy,om]=o.desde.split('-').map(Number);
    const[ty,tm]=ym.split('-').map(Number);
    const diff=(ty-oy)*12+(tm-om);
    if(diff<0) return;
    let activo=false;
    if(o.tipo==='recurrente'){
      activo = !o.hasta || ym<=o.hasta;
    } else if(o.tipo==='unico'){
      activo = diff===0;
    } else if(o.tipo==='cuotas'){
      activo = diff<(o.ncuotas||1);
    }
    if(activo){
      if(o.moneda==='USD') totalUSD+=o.monto;
      else totalARS+=o.monto;
    }
  });
  return {usd:totalUSD, ars:totalARS, total_usd: totalUSD + totalARS/tc};
}

// ─── COBROS CALC ─────────────────────────────────────────────────────────────
function calcCobrosYM(ym, tc){
  tc = tc||caja.tc||1200;
  let totalUSD=0, totalARS=0;
  ventas.filter(v=>!filtroProyecto||v.proyecto===filtroProyecto).forEach(v=>{
    v.cuotas.forEach(c=>{
      const[cy,cm]=c.mes.split('-').map(Number);
      const[ty,tm]=ym.split('-').map(Number);
      const diff=(ty-cy)*12+(tm-cm);
      if(diff>=0 && diff<c.cantidad){
        if(c.moneda==='USD') totalUSD+=c.monto;
        else totalARS+=c.monto;
      }
    });
  });
  return {usd:totalUSD, ars:totalARS, total_usd: totalUSD + totalARS/tc};
}

// ─── EGRESOS CALC ────────────────────────────────────────────────────────────
function calcEgresosYM(ym, tc){
  tc = tc||caja.tc||1200;
  let totalARS=0, totalUSD=0;
  egresos.filter(e=>!filtroProyecto||!e.proyecto||e.proyecto===filtroProyecto).forEach(e=>{
    let activo=false;
    if(e.freq==='unico') activo = e.mes===ym;
    else if(e.freq==='mensual') activo = e.mes<=ym;
    else if(e.freq==='trimestral'){
      const[ey,em]=e.mes.split('-').map(Number);
      const[ty,tm]=ym.split('-').map(Number);
      const diff=(ty-ey)*12+(tm-em);
      activo = diff>=0 && diff%3===0;
    }
    if(activo){
      if(e.moneda==='USD') totalUSD+=e.monto;
      else totalARS+=e.monto;
    }
  });
  return {usd:totalUSD, ars:totalARS, total_usd: totalUSD + totalARS/tc};
}

// ─── SIMULADOR DE VENTAS ─────────────────────────────────────────────────────
function recalcSim(){
  const entregaEl  = document.getElementById('sim-entrega');
  const cuotasEl   = document.getElementById('sim-cuotas');
  const precioEl   = document.getElementById('sim-precio');
  const mesesEl    = document.getElementById('sim-meses');
  const resEl      = document.getElementById('sim-resultado');
  if(!entregaEl||!resEl) return;

  const entrega    = parseFloat(entregaEl.value)||0.4;
  const numCuotas  = parseInt(cuotasEl.value)||24;
  const precio     = parseFloat(precioEl.value)||0;
  const mesesCubr  = parseInt(mesesEl.value)||6;
  const deficit    = window.__simDeficit||0;
  const stockN     = window.__simStockN||0;

  if(precio<=0){ resEl.innerHTML='<span style="color:var(--muted)">Ingresá un precio por unidad.</span>'; return; }

  // Ingreso en efectivo por unidad al momento de venta
  const ingrContado   = precio * entrega;
  // Cuota mensual del saldo restante
  const saldoCuota    = precio * (1 - entrega);
  const cuotaMensual  = numCuotas>0 ? saldoCuota/numCuotas : 0;

  // Ingreso total dentro del período a cubrir (contado + cuotas que caen en el período)
  const cuotasEnPeriodo = Math.min(numCuotas, mesesCubr);
  const ingrPorUnidadEnPeriodo = ingrContado + cuotaMensual * cuotasEnPeriodo;

  // Unidades necesarias para cubrir el déficit con ese ingreso en el período
  const unidadesNecPeriodo = deficit > 0
    ? Math.ceil(deficit / ingrPorUnidadEnPeriodo)
    : 0;

  // Unidades necesarias si se cobrara todo al contado (referencia)
  const unidadesContado = deficit > 0 ? Math.ceil(deficit / precio) : 0;

  const pctEntregaFmt = Math.round(entrega*100)+'%';
  const pctSaldoFmt   = Math.round((1-entrega)*100)+'%';
  const fmtU = n => `<strong style="font-size:15px;color:var(--accent)">${n}</strong>`;
  const stockOk  = unidadesNecPeriodo <= stockN;
  const stockPar = !stockOk && stockN > 0 && unidadesNecPeriodo > 0;

  let html = '';

  if(deficit <= 0){
    html = `<span style="color:var(--green)">✓ No hay déficit a cubrir con el plazo y filtro seleccionados.</span>`;
  } else {
    html = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px">
        <div>
          <div style="font-size:10px;color:var(--muted);margin-bottom:2px">Plan: ${pctEntregaFmt} firma + ${pctSaldoFmt} en ${numCuotas} cuotas</div>
          <div>Ingreso por unidad en ${mesesCubr}m: <strong style="font-family:var(--mono)">${fmtUSD(Math.round(ingrPorUnidadEnPeriodo))}</strong></div>
          <div style="margin-top:4px">Unidades necesarias: ${fmtU(unidadesNecPeriodo)} unidad${unidadesNecPeriodo!==1?'es':''}</div>
          <div style="font-size:11px;color:var(--muted);margin-top:2px">
            (vs. ${unidadesContado} ud${unidadesContado!==1?'s':''} si fuera 100% contado)
          </div>
        </div>
        <div>
          <div style="font-size:10px;color:var(--muted);margin-bottom:2px">Ingreso efectivo de esas ${unidadesNecPeriodo} ventas</div>
          <div>Contado (firma): <strong style="font-family:var(--mono);color:var(--green)">${fmtUSD(Math.round(ingrContado*unidadesNecPeriodo))}</strong></div>
          <div>Cuotas en ${mesesCubr}m: <strong style="font-family:var(--mono);color:var(--blue)">${fmtUSD(Math.round(cuotaMensual*cuotasEnPeriodo*unidadesNecPeriodo))}</strong></div>
          <div>Saldo restante (post-período): <strong style="font-family:var(--mono);color:var(--muted)">${fmtUSD(Math.round(cuotaMensual*Math.max(0,numCuotas-cuotasEnPeriodo)*unidadesNecPeriodo))}</strong></div>
        </div>
      </div>
      <div style="padding:8px 10px;border-radius:var(--radius-sm);background:${stockOk?'rgba(96,208,152,0.1)':stockPar?'rgba(240,184,96,0.1)':'rgba(240,96,96,0.1)'};font-size:12px;color:${stockOk?'var(--green)':stockPar?'var(--amber)':'var(--red)'}">
        ${stockOk
          ? `✓ El stock disponible (${stockN} uds.) es suficiente para cubrir el déficit con este plan.`
          : stockPar
          ? `⚠ El stock disponible (${stockN} uds.) cubre parcialmente — faltan ${unidadesNecPeriodo-stockN} unidades más.`
          : `✕ No hay unidades en stock para cubrir el déficit.`}
      </div>`;
  }
  resEl.innerHTML = html;
}

// ─── SHARED CHART HELPERS ────────────────────────────────────────────────────
function buildBarChart(container, datasets, labels, opts){
  // datasets: [{label, values, color}], labels: string[]
  // opts: {height, stacked, showLegend}
  const h = opts.height||120;
  const allVals = datasets.flatMap(d=>d.values);
  const maxV = Math.max(...allVals, 1);
  const minV = Math.min(...allVals, 0);
  const range = maxV - minV || 1;

  let legend = '';
  if(opts.showLegend!==false){
    legend = `<div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:8px">
      ${datasets.map(d=>`<div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)">
        <div style="width:10px;height:10px;border-radius:2px;background:${d.color};flex-shrink:0"></div>${d.label}
      </div>`).join('')}
    </div>`;
  }

  const zeroY = Math.round((maxV / range) * h);

  const bars = labels.map((lbl,i)=>{
    const cols = datasets.map(d=>{
      const v = d.values[i]||0;
      const barH = Math.max(2, Math.abs(Math.round(v/range*h)));
      const isNeg = v < 0;
      return `<div style="flex:1;display:flex;flex-direction:column;align-items:stretch;justify-content:${isNeg?'flex-start':'flex-end'};height:${h}px">
        <div style="height:${barH}px;background:${d.color};border-radius:2px;opacity:0.88"></div>
      </div>`;
    }).join('');
    return `<div style="display:flex;flex-direction:column;align-items:center;flex:1;gap:2px">
      <div style="display:flex;gap:2px;width:100%;align-items:flex-end;height:${h}px">${cols}</div>
      <div style="font-size:9px;color:var(--muted);font-family:var(--mono);white-space:nowrap">${lbl}</div>
    </div>`;
  }).join('');

  // zero line
  const zeroLine = minV < 0 ? `<div style="position:absolute;left:0;right:0;bottom:18px;height:1px;background:var(--border2);z-index:1"></div>` : '';

  container.innerHTML = legend + `<div style="position:relative"><div style="display:flex;gap:3px;align-items:flex-end">${bars}</div>${zeroLine}</div>`;
}

function buildLineChart(container, datasets, labels, opts){
  // kept for dashboards tab compatibility
  const h=opts.height||120, w=opts.width||600;
  const allV=datasets.flatMap(d=>d.values);
  const maxV=Math.max(...allV,1), minV=Math.min(...allV,0), range=maxV-minV||1;
  const n=labels.length; if(n<2) return;
  const pL=44,pR=12,pT=10,pB=22;
  const cW=w-pL-pR, cH=h-pT-pB;
  const xP=i=>pL+Math.round(i*(cW/(n-1)));
  const yP=v=>pT+cH-Math.round((v-minV)/range*cH);
  // y axis ticks
  const ticks=5;
  let yAxis='';
  for(let t=0;t<=ticks;t++){
    const v=minV+(maxV-minV)*t/ticks;
    const y=yP(v);
    const lbl=v>=1000?Math.round(v/1000)+'k':Math.round(v);
    yAxis+=`<line x1="${pL-4}" y1="${y}" x2="${w-pR}" y2="${y}" stroke="#2e2e2e" stroke-width="0.5"/>`;
    yAxis+=`<text x="${pL-6}" y="${y+4}" text-anchor="end" font-size="8" fill="#666" font-family="monospace">${lbl}</text>`;
  }
  const zLine=minV<0?`<line x1="${pL}" y1="${yP(0)}" x2="${w-pR}" y2="${yP(0)}" stroke="#555" stroke-width="1" stroke-dasharray="3,3"/>`:'';
  const paths=datasets.map(d=>{
    const pts=d.values.map((v,i)=>`${xP(i)},${yP(v)}`).join(' L');
    const area=`M${xP(0)},${yP(d.values[0])} L${pts} L${xP(n-1)},${pT+cH} L${xP(0)},${pT+cH} Z`;
    return `<path d="M${pts}" fill="none" stroke="${d.color}" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="${area}" fill="${d.color}" opacity="0.07"/>`;
  }).join('');
  const step=n>18?3:n>10?2:1;
  const xlbls=labels.map((l,i)=>i%step===0?`<text x="${xP(i)}" y="${h-5}" text-anchor="middle" font-size="8" fill="#666" font-family="monospace">${l}</text>`:'').join('');
  const legend=opts.showLegend===false?'':
    `<div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:6px">${datasets.map(d=>`<div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)"><div style="width:16px;height:2px;background:${d.color}"></div>${d.label}</div>`).join('')}</div>`;
  container.innerHTML=legend+`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px">${yAxis}${zLine}${paths}${xlbls}</svg>`;
}

function buildDashChart(container, meses, ingrMes, egrMes, saldoAcum, cajaInicial, n){
  const W=480, H=270, pL=58, pR=14, pT=16, pB=28;
  const cW=W-pL-pR, cH=H-pT-pB;

  const allV=[...ingrMes,...egrMes,...saldoAcum,cajaInicial,0];
  const rawMax=Math.max(...allV), rawMin=Math.min(...allV,0);
  // nice round scale
  const niceN=v=>{if(v===0)return 0;const mag=Math.pow(10,Math.floor(Math.log10(Math.abs(v))));return Math.ceil(v/mag)*mag;};
  const maxV=niceN(rawMax*1.08)||1, minV=rawMin<0?-niceN(Math.abs(rawMin)*1.08):0;
  const range=maxV-minV||1;
  const xP=i=>pL+Math.round(i*(cW/(n-1)));
  const yP=v=>pT+cH-Math.round((v-minV)/range*cH);

  // Y axis grid + labels
  const ticks=5; let grid='';
  for(let t=0;t<=ticks;t++){
    const v=minV+(maxV-minV)*t/ticks;
    const y=yP(v);
    const abs=Math.abs(v);
    const lbl=abs>=1000000?'$'+(v/1000000).toFixed(1)+'M':abs>=1000?'$'+(v/1000).toFixed(0)+'k':'$'+Math.round(v);
    grid+=`<line x1="${pL}" y1="${y}" x2="${W-pR}" y2="${y}" stroke="${Math.abs(v)<1?'#444':'#2a2a2a'}" stroke-width="${Math.abs(v)<1?'1':'0.5'}"/>`;
    grid+=`<text x="${pL-4}" y="${y+3}" text-anchor="end" font-size="8.5" fill="${Math.abs(v)<1?'#aaa':'#555'}" font-family="monospace">${lbl}</text>`;
  }

  // Zero line (prominent if negative values exist)
  const zeroLine=minV<0?`<line x1="${pL}" y1="${yP(0)}" x2="${W-pR}" y2="${yP(0)}" stroke="#666" stroke-width="1.2" stroke-dasharray="4,3"/>`:'';

  // Bar chart for ingresos/egresos (background bars)
  const barW=Math.max(2, Math.round(cW/n*0.35));
  let bars='';
  meses.forEach((_,i)=>{
    const x=xP(i);
    // ingreso bar
    const iH=Math.max(1,Math.round((ingrMes[i]-0)/range*cH));
    const iY=yP(ingrMes[i]);
    bars+=`<rect x="${x-barW-1}" y="${iY}" width="${barW}" height="${iH}" fill="#60d098" opacity="0.5" rx="1"/>`;
    // egreso bar
    const eH=Math.max(1,Math.round((egrMes[i]-0)/range*cH));
    const eY=yP(egrMes[i]);
    bars+=`<rect x="${x+1}" y="${eY}" width="${barW}" height="${eH}" fill="#f06060" opacity="0.5" rx="1"/>`;
  });

  // Saldo acumulado line
  const pts=saldoAcum.map((v,i)=>`${xP(i)},${yP(v)}`).join(' L');
  const areaTop=`M${xP(0)},${yP(saldoAcum[0])} L${pts}`;
  // Color area: green above zero, red below
  const zeroY=yP(0);
  const saldoLine=`<path d="${areaTop}" fill="none" stroke="#c8f060" stroke-width="2.2" stroke-linejoin="round"/>`;
  // Dots on saldo line — mark the first negative
  const firstNeg=saldoAcum.findIndex(s=>s<0);
  let dots=saldoAcum.map((v,i)=>{
    const isBreak=i===firstNeg;
    const col=v<0?'#f06060':'#c8f060';
    return isBreak
      ? `<circle cx="${xP(i)}" cy="${yP(v)}" r="5" fill="#f06060" stroke="#0f0f0f" stroke-width="1.5"/>
         <text x="${xP(i)}" y="${yP(v)-10}" text-anchor="middle" font-size="9" fill="#f06060" font-family="monospace">⚠</text>`
      : (i===0||i===n-1||i%Math.ceil(n/6)===0?`<circle cx="${xP(i)}" cy="${yP(v)}" r="2.5" fill="${col}"/>`:'');
  }).join('');

  // Value labels on saldo line (start, end, breakeven)
  let valLabels='';
  const labelIdxs=[0, n-1, ...(firstNeg>=0?[firstNeg]:[])];
  new Set(labelIdxs).forEach(i=>{
    const v=saldoAcum[i];
    const abs=Math.abs(v);
    const lbl=abs>=1000000?'$'+(v/1000000).toFixed(1)+'M':abs>=1000?'$'+(v/1000).toFixed(0)+'k':'$'+Math.round(v);
    const col=v<0?'#f06060':'#c8f060';
    const yOff=v<0?14:-7;
    valLabels+=`<text x="${xP(i)}" y="${yP(v)+yOff}" text-anchor="${i===0?'start':i===n-1?'end':'middle'}" font-size="8.5" fill="${col}" font-family="monospace" font-weight="bold">${lbl}</text>`;
  });

  // X axis labels
  const xStep=n>18?3:n>12?2:1;
  const xlbls=meses.map((m,i)=>i%xStep===0?
    `<text x="${xP(i)}" y="${H-7}" text-anchor="middle" font-size="8" fill="#666" font-family="monospace">${MESES[parseInt(m.split('-')[1])-1]+"'"+(m.slice(2,4))}</text>`
  :'').join('');

  // Legend
  const legend=`
    <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:6px;font-size:11px;color:var(--muted)">
      <div style="display:flex;align-items:center;gap:5px"><div style="width:10px;height:10px;background:#60d098;opacity:0.7;border-radius:2px"></div>Ingresos</div>

      <div style="display:flex;align-items:center;gap:5px"><div style="width:16px;height:2px;background:#c8f060"></div>Saldo acumulado</div>
      ${firstNeg>=0?'<div style="display:flex;align-items:center;gap:5px"><div style="width:10px;height:10px;background:#f06060;border-radius:50%"></div>Punto de quiebre</div>':''}
    </div>`;

  container.innerHTML = legend +
    `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:${H}px;display:block">
      ${grid}${zeroLine}${bars}${saldoLine}${dots}${valLabels}${xlbls}
    </svg>`;
}

// ─── DASHBOARD ───────────────────────────────────────────────────────────────
let dashPresetMonths = 6;

function setDashPreset(months){
  dashPresetMonths = months;
  document.querySelectorAll('.dash-preset').forEach(b=>{
    const active = parseInt(b.dataset.m)===months;
    b.classList.toggle('active', active);
    b.style.background  = active ? 'var(--accent)' : '';
    b.style.color       = active ? '#0f0f0f' : '';
    b.style.borderColor = active ? 'var(--accent)' : '';
  });
  renderDashboardProj();
}

function renderDashboard(){
  const tc = caja.tc||1200;
  const hoy = todayYM();
  const cobrosHoy  = calcCobrosYM(hoy, tc);
  cobrosHoy.total_usd += calcOtrosIngYM(hoy, tc).total_usd;
  const egresosHoy = calcEgresosYM(hoy, tc);
  const cajaTotal  = getTotalUSD();

  document.getElementById('dash-metrics').innerHTML=`
    <div class="metric-card"><div class="metric-label">Caja actual (USD)</div><div class="metric-val accent">${fmtUSD(cajaTotal)}</div><div class="metric-sub">Suma de todas las cuentas</div></div>
    <div class="metric-card"><div class="metric-label">Ingresos este mes</div><div class="metric-val green">${fmtUSD(cobrosHoy.total_usd)}</div><div class="metric-sub">${ym2label(hoy)}</div></div>
    <div class="metric-card"><div class="metric-label">Egresos este mes</div><div class="metric-val red">${fmtUSD(egresosHoy.total_usd)}</div><div class="metric-sub">${ym2label(hoy)}</div></div>
    <div class="metric-card"><div class="metric-label">Ventas activas</div><div class="metric-val">${ventas.length}</div><div class="metric-sub">Con plan de pago</div></div>
    <div class="metric-card"><div class="metric-label">Stock disponible</div><div class="metric-val amber">${stock.filter(s=>s.estado==='Disponible').length} <span style="font-size:13px;color:var(--muted)">uds.</span></div><div class="metric-sub">${fmtUSD(stock.filter(s=>s.estado==='Disponible').reduce((t,s)=>t+(s.moneda==='USD'?s.precio:s.precio/tc),0))}</div></div>
  `;

  renderDashboardProj();
}

function renderDashboardProj(){
  const tc = caja.tc||1200;
  const hoy = todayYM();
  const cajaTotal = getTotalUSD();
  const n = dashPresetMonths;

  const mesesN  = Array.from({length:n},(_,i)=>addMonths(hoy,i));
  const ingrMes = mesesN.map(m=>calcCobrosYM(m,tc).total_usd + calcOtrosIngYM(m,tc).total_usd);
  const egrMes  = mesesN.map(m=>calcEgresosYM(m,tc).total_usd);
  const netoMes = mesesN.map((_,i)=>ingrMes[i]-egrMes[i]);
  const ingrTot = ingrMes.reduce((s,x)=>s+x,0);
  const egrTot  = egrMes.reduce((s,x)=>s+x,0);
  const saldoProy = cajaTotal + netoMes.reduce((s,x)=>s+x,0);

  // Update chart title
  // chart title removed

  document.getElementById('dash-proj-metrics').innerHTML=`
    <div class="metric-card" style="border-color:rgba(96,208,152,0.3)">
      <div class="metric-label">Ingresos proyectados ${n}m</div>
      <div class="metric-val green">${fmtUSD(ingrTot)}</div>
      <div class="metric-sub">Cobros de cuotas vigentes</div>
    </div>
    <div class="metric-card" style="border-color:rgba(240,96,96,0.3)">
      <div class="metric-label">Egresos proyectados ${n}m</div>
      <div class="metric-val red">${fmtUSD(egrTot)}</div>
      <div class="metric-sub">Gastos registrados</div>
    </div>
    <div class="metric-card" style="border-color:${saldoProy>=0?'rgba(200,240,96,0.3)':'rgba(240,96,96,0.3)'}">
      <div class="metric-label">Saldo proyectado ${n}m</div>
      <div class="metric-val ${saldoProy>=0?'accent':'red'}">${fmtUSD(saldoProy)}</div>
      <div class="metric-sub">Caja disponible hoy + flujo ${n}m</div>
    </div>
  `;

  // ── Simulador de ventas ───────────────────────────────────────────────────
  const stockDisp = stock.filter(s=>s.estado==='Disponible'||s.estado==='En pozo');
  const m2Total   = stockDisp.reduce((s,u)=>s+(u.m2||0),0);
  const valTotal  = stockDisp.reduce((s,u)=>s+(u.moneda==='USD'?u.precio:u.precio/tc),0);
  const promM2    = stockDisp.length>0 ? m2Total/stockDisp.length : 0;
  const promPxM2  = m2Total>0 ? valTotal/m2Total : 0;
  const promPrecio= stockDisp.length>0 ? valTotal/stockDisp.length : 0;
  const deficit   = saldoProy < 0 ? Math.abs(saldoProy) : 0;
  window.__simDeficit = deficit;
  window.__simStockN  = stockDisp.length;

  const statusCol = saldoProy>=0?'rgba(96,208,152,0.1)':'rgba(240,96,96,0.08)';
  const borderCol = saldoProy>=0?'rgba(96,208,152,0.3)':'rgba(240,96,96,0.3)';
  const icon      = saldoProy>=0?'✅':'⚠️';
  const statusTxt = saldoProy>=0
    ? `Flujo proyectado a <strong>${n} meses</strong> positivo. Saldo final: <strong style="color:var(--green)">${fmtUSD(saldoProy)}</strong>.`
    : `Flujo proyectado a <strong>${n} meses</strong> negativo. Déficit: <strong style="color:var(--red)">${fmtUSD(deficit)}</strong>.`;

  document.getElementById('dash-insight').innerHTML = `
    <div style="background:${statusCol};border:1px solid ${borderCol};border-radius:var(--radius);padding:16px 18px;margin-bottom:0">
      <div style="display:flex;gap:10px;align-items:flex-start;margin-bottom:${stockDisp.length>0?'14':'0'}px">
        <div style="font-size:18px;flex-shrink:0">${icon}</div>
        <div style="font-size:13px;line-height:1.6">${statusTxt}
          ${stockDisp.length===0?' <span style="color:var(--muted)">Cargá unidades en Stock para simular ventas.</span>':''}
        </div>
      </div>
      ${stockDisp.length===0 ? '' : `
      <div style="border-top:1px solid var(--border);padding-top:14px">
        <div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:12px">
          Simulador — ¿Cuántas unidades vender para cubrir el déficit?
        </div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px">
          <div style="background:var(--surface2);border-radius:var(--radius-sm);padding:10px 12px">
            <div style="font-size:10px;color:var(--muted);margin-bottom:3px">Stock disponible</div>
            <div style="font-size:18px;font-weight:500;font-family:var(--mono)">${stockDisp.length} uds.</div>
            <div style="font-size:10px;color:var(--muted)">${fmtN(Math.round(promM2))} m² promedio</div>
          </div>
          <div style="background:var(--surface2);border-radius:var(--radius-sm);padding:10px 12px">
            <div style="font-size:10px;color:var(--muted);margin-bottom:3px">Precio m² promedio</div>
            <div style="font-size:18px;font-weight:500;font-family:var(--mono)">${fmtUSD(Math.round(promPxM2))}</div>
          </div>
          <div style="background:var(--surface2);border-radius:var(--radius-sm);padding:10px 12px">
            <div style="font-size:10px;color:var(--muted);margin-bottom:3px">Precio unidad promedio</div>
            <div style="font-size:18px;font-weight:500;font-family:var(--mono)">${fmtUSD(Math.round(promPrecio))}</div>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px">
          <div>
            <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px">Entrega al firmar</label>
            <select id="sim-entrega" onchange="recalcSim()" style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 8px;color:var(--text);font-size:12px;outline:none">
              <option value="0.30">30%</option>
              <option value="0.40" selected>40%</option>
              <option value="0.50">50%</option>
              <option value="0.60">60%</option>
              <option value="1.00">100% contado</option>
            </select>
          </div>
          <div>
            <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px">Saldo en cuotas</label>
            <select id="sim-cuotas" onchange="recalcSim()" style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 8px;color:var(--text);font-size:12px;outline:none">
              <option value="12">12 cuotas</option>
              <option value="18">18 cuotas</option>
              <option value="24" selected>24 cuotas</option>
              <option value="30">30 cuotas</option>
              <option value="36">36 cuotas</option>
            </select>
          </div>
          <div>
            <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px">Precio unit. (USD)</label>
            <input id="sim-precio" type="number" value="${Math.round(promPrecio)||100000}" onchange="recalcSim()" style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 8px;color:var(--text);font-size:12px;outline:none">
          </div>
          <div>
            <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px">Período (meses)</label>
            <input id="sim-meses" type="number" value="${n}" min="1" max="36" onchange="recalcSim()" style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 8px;color:var(--text);font-size:12px;outline:none">
          </div>
        </div>
        <div id="sim-resultado" style="background:var(--surface2);border-radius:var(--radius-sm);padding:12px 14px;font-size:13px;line-height:1.8"></div>
      </div>`}
    </div>`;

  if(stockDisp.length>0) setTimeout(recalcSim, 50);

    // Store saldoProy for use by proj summary
  window.__saldoProy = saldoProy;

  // ── Saldo acumulado mes a mes ─────────────────────────────────────────────
  let sal = cajaTotal;
  const saldoAcum = mesesN.map((_,i)=>{ sal+=netoMes[i]; return sal; });
  const firstNeg = saldoAcum.findIndex(s=>s<0);

  // Chart removed — replaced by table below

  // ── Breakeven table ───────────────────────────────────────────────────────
  const tblEl = document.getElementById('dash-breakeven-table');
  // Show every month — trim trailing months with zero ingr+egr for clarity
  const lastActive = mesesN.reduce((last,_,i)=>(ingrMes[i]>0||egrMes[i]>0?i:last), mesesN.length-1);
  const visN = Math.min(mesesN.length, lastActive+2);

  let tblRows = mesesN.slice(0,visN).map((m,i)=>{
    const saldo  = saldoAcum[i];
    const neto   = netoMes[i];
    const isNeg  = saldo < 0;
    const wasPos = i===0 ? cajaTotal>=0 : saldoAcum[i-1]>=0;
    const quiebre = isNeg && wasPos;
    return `<tr style="${quiebre?'background:rgba(240,96,96,0.1);':''}${isNeg?'color:var(--red)':''}">
      <td style="font-weight:500;white-space:nowrap;${quiebre?'color:var(--red)':''}">${quiebre?'⚠ ':''} ${ym2label(m)}</td>
      <td class="positive">${fmtUSD(ingrMes[i])}</td>
      <td class="negative">${fmtUSD(egrMes[i])}</td>
      <td class="${neto>=0?'positive':'negative'}">${neto>=0?'+':''}${fmtUSD(neto)}</td>
      <td style="font-weight:600;font-family:var(--mono);font-size:12px;color:${isNeg?'var(--red)':saldo>cajaTotal*1.1?'var(--green)':'var(--text)'}">${fmtUSD(saldo)}</td>
    </tr>`;
  }).join('');

  const quiebreMsg = firstNeg>=0
    ? `<div style="font-size:12px;color:var(--red);margin-top:8px">⚠ La caja proyectada se vuelve negativa en <strong>${ym2label(mesesN[firstNeg])}</strong> (mes ${firstNeg+1}).</div>`
    : `<div style="font-size:12px;color:var(--green);margin-top:8px">✓ La caja proyectada se mantiene positiva durante todo el período.</div>`;

  tblEl.innerHTML = `
    <div class="section-hdr" style="margin-bottom:8px">
      <span class="section-title">Saldo de caja mes a mes</span>
      <span style="font-size:11px;color:var(--muted)">Caja actual + ingresos acumulados − egresos acumulados</span>
    </div>
    <div class="tbl-wrap" style="max-height:260px;overflow-y:auto">
      <table>
        <thead><tr>
          <th style="position:sticky;top:0;background:var(--surface2)">Mes</th>
          <th style="position:sticky;top:0;background:var(--surface2);text-align:right;color:#60d098">Ingresos</th>
          <th style="position:sticky;top:0;background:var(--surface2);text-align:right;color:#f06060">Egresos</th>
          <th style="position:sticky;top:0;background:var(--surface2);text-align:right">Flujo neto</th>
          <th style="position:sticky;top:0;background:var(--surface2);text-align:right">Saldo caja</th>
        </tr></thead>
        <tbody>${tblRows}</tbody>
      </table>
    </div>
    ${quiebreMsg}
  `;

  // Caja detail — dynamic accounts
  const cuentasDash = caja.cuentas||CUENTAS_DEFAULT;
  document.getElementById('dash-caja-detail').innerHTML=`
    <div style="display:flex;flex-direction:column;gap:0">
      ${cuentasDash.map(c=>{
        const s=getSaldoActual(c.id);
        const v=s?s.monto:null;
        return `<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border)">
          <span style="color:var(--muted);font-size:12px">${c.nombre}</span>
          <span style="font-family:var(--mono);font-size:12px">${v!==null?fmtMon(v,c.moneda):'—'}</span>
        </div>`;
      }).join('')}
      <div style="display:flex;justify-content:space-between;padding:8px 0;font-weight:600;margin-top:2px">
        <span>Total $</span>
        <span style="font-family:var(--mono);color:var(--accent)">${fmtUSD(cajaTotal)}</span>
      </div>
    </div>
  `;

  // Próximos cobros
  const proximos = [];
  ventas.forEach(v=>{
    v.cuotas.forEach(c=>{
      for(let i=0;i<Math.min(c.cantidad,3);i++){
        const m2 = addMonths(c.mes,i);
        if(m2>=hoy && m2<=addMonths(hoy,2)){
          proximos.push({unidad:v.unidad,comprador:v.comprador,tipo:c.tipo,mes:m2,monto:c.monto,moneda:c.moneda,cac:c.cac});
        }
      }
    });
  });
  proximos.sort((a,b)=>a.mes.localeCompare(b.mes));
  // ── Últimas ventas ────────────────────────────────────────────────────────
  const ultimasEl = document.getElementById('dash-ultimas-ventas');
  if(ultimasEl){
    const ultimas = ventas
      .slice()
      .sort((a,b)=>b.fecha.localeCompare(a.fecha))
      .slice(0,8);
    if(!ultimas.length){
      ultimasEl.innerHTML='<div class="empty"><p>Sin ventas registradas.</p></div>';
    } else {
      ultimasEl.innerHTML=`<div class="tbl-wrap">
        <table>
          <thead><tr>
            <th>Unidad</th><th>Comprador</th><th>Proyecto</th>
            <th style="text-align:right">Precio total</th><th>Firma</th>
            <th>Tramos</th>
          </tr></thead>
          <tbody>${ultimas.map(v=>`<tr>
            <td style="font-weight:500">${v.unidad}</td>
            <td style="color:var(--muted);font-size:12px">${v.comprador}</td>
            <td>${v.proyecto?`<span class="tag" style="background:${PROY_COLORS[v.proyecto]?'rgba(96,208,152,0.1)':'rgba(255,255,255,0.06)'};color:${PROY_COLORS[v.proyecto]||'var(--muted)'};font-size:10px">${v.proyecto}</span>`:'—'}</td>
            <td><span class="tag ${v.moneda==='USD'?'tag-usd':'tag-ars'}">${fmtMon(v.precio,v.moneda)}</span></td>
            <td style="font-family:var(--mono);font-size:12px">${ym2label(v.fecha)}</td>
            <td style="font-size:11px;color:var(--muted)">${v.cuotas.length} tramo${v.cuotas.length!==1?'s':''}</td>
          </tr>`).join('')}</tbody>
        </table>
      </div>`;
    }
  }

  document.getElementById('dash-proximos').innerHTML = proximos.length?proximos.slice(0,6).map(p=>`
    <div style="display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:6px">
      <div><div style="font-size:13px;font-weight:500">${p.unidad} — ${p.tipo}</div><div style="font-size:11px;color:var(--muted)">${p.comprador} · ${ym2label(p.mes)}</div></div>
      <div style="font-family:var(--mono);font-size:14px;font-weight:500;color:var(--green)">${fmtMon(p.monto,p.moneda)}${p.cac?' <span class="tag tag-cac">CAC</span>':''}</div>
    </div>
  `).join(''):`<div class="empty"><p>Sin cobros en los próximos 3 meses.</p></div>`;
}

// ─── VENTAS ──────────────────────────────────────────────────────────────────
function highlight(text, query){
  if(!query) return text;
  const re = new RegExp('('+query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
  return String(text).replace(re,'<mark style="background:rgba(200,240,96,0.35);color:inherit;border-radius:2px;padding:0 1px">$1</mark>');
}

function renderVentas(){
  const el = document.getElementById('lista-ventas');
  const q  = (document.getElementById('search-ventas')||{value:''}).value.trim().toLowerCase();
  const fp = (document.getElementById('filter-ventas-proy')||{value:''}).value;

  if(!ventas.length){
    el.innerHTML='<div class="empty"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg><p>No hay ventas cargadas.<br>Usá el botón "Nueva venta" para comenzar.</p></div>';
    return;
  }

  let filtered = ventas;
  if(fp) filtered = filtered.filter(v=>v.proyecto===fp);
  if(q)  filtered = filtered.filter(v=>{
    const haystack = [v.unidad, v.comprador, v.proyecto||'', v.obs||'',
      v.cuotas.map(c=>c.tipo).join(' ')].join(' ').toLowerCase();
    return haystack.includes(q);
  });

  const countEl = document.getElementById('ventas-count');
  if(countEl) countEl.textContent = filtered.length + ' de ' + ventas.length + ' ventas';

  // Sort
  const sv = (document.getElementById('sort-ventas')||{value:'fecha-desc'}).value;
  filtered.sort((a,b)=>{
    if(sv==='fecha-asc')  return a.fecha.localeCompare(b.fecha);
    if(sv==='fecha-desc') return b.fecha.localeCompare(a.fecha);
    if(sv==='nombre-asc') return (a.unidad||'').localeCompare(b.unidad||'');
    if(sv==='nombre-desc')return (b.unidad||'').localeCompare(a.unidad||'');
    if(sv==='monto-asc')  return (a.moneda==='USD'?a.precio:a.precio/1200)-(b.moneda==='USD'?b.precio:b.precio/1200);
    if(sv==='monto-desc') return (b.moneda==='USD'?b.precio:b.precio/1200)-(a.moneda==='USD'?a.precio:a.precio/1200);
    return 0;
  });

  if(!filtered.length){
    el.innerHTML=`<div class="empty"><p>Sin resultados para "<strong>${q||fp}</strong>".</p></div>`;
    return;
  }

  el.innerHTML = filtered.map(v=>`
    <div class="venta-card">
      <div class="venta-card-top">
        <div style="flex:1">
          <div class="venta-nombre">${highlight(v.unidad,q)}</div>
          <div class="venta-meta">${highlight(v.comprador,q)} · Firma: ${ym2label(v.fecha)}</div>
          ${v.proyecto?`<span class="tag" style="background:${PROY_COLORS[v.proyecto]?'rgba(96,208,152,0.12)':'rgba(255,255,255,0.06)'};color:${PROY_COLORS[v.proyecto]||'#60d098'};margin-top:4px">${highlight(v.proyecto,q)}</span>`:''}
          <div class="venta-tags">
            <span class="tag ${v.moneda==='USD'?'tag-usd':'tag-ars'}">${fmtMon(v.precio,v.moneda)}</span>
            ${v.cac?'<span class="tag tag-cac">CAC</span>':''}
            ${v.cuotas.map(c=>`<span class="tag ${c.moneda==='USD'?'tag-usd':c.cac?'tag-cac':'tag-ars'}">${highlight(c.tipo,q)}${c.cantidad>1?' ×'+c.cantidad:''}</span>`).join('')}
          </div>
          ${v.obs?`<div style="margin-top:6px;font-size:11px;color:var(--muted)">${highlight(v.obs,q)}</div>`:''}
        </div>
        <div class="venta-actions">
          <button class="btn btn-sm btn-ghost" onclick="editarVenta(${v.id})" title="Editar">✎</button>
          <button class="btn btn-sm btn-danger" onclick="eliminarVenta(${v.id})" title="Eliminar">✕</button>
        </div>
      </div>
    </div>
  `).join('');
}

function openModalVenta(id=null){
  editingVentaId = id;
  const v = id?ventas.find(x=>x.id===id):null;

let editingCuentaId = null;
let saldoTargetId = null;

const CUENTAS_DEFAULT = [
  {id:'cta-1', nombre:'Caja efectivo',    tipo:'caja',  moneda:'USD'},
  {id:'cta-2', nombre:'Banco Francisco',  tipo:'banco', moneda:'USD'},
  {id:'cta-3', nombre:'Banco Javier',     tipo:'banco', moneda:'USD'},
  {id:'cta-4', nombre:'Banco Q2',         tipo:'banco', moneda:'USD'},
  {id:'cta-5', nombre:'Banco Melian',     tipo:'banco', moneda:'USD'},
  {id:'cta-6', nombre:'Banco Paroissien', tipo:'banco', moneda:'USD'},
  {id:'cta-7', nombre:'Banco Olazabal',   tipo:'banco', moneda:'USD'},
  {id:'cta-8', nombre:'Cuenta exterior',  tipo:'ext',   moneda:'USD'},
  {id:'cta-9', nombre:'Otras',            tipo:'otro',  moneda:'USD'},
];

function cajaTab(t){
  currentCajaTab = t;
  document.querySelectorAll('.sub-tab[id^="ctab"]').forEach(b=>b.classList.toggle('active', b.id==='ctab-'+t));
  renderCaja();
}

function getTc(){ return caja.tc||1200; }

function getSaldoActual(cuentaId){
  const hist = (caja.historial||[]).filter(h=>h.cuentaId===cuentaId);
  if(!hist.length) return null;
  hist.sort((a,b)=>b.fecha.localeCompare(a.fecha)||b.ts-a.ts);
  return hist[0];
}

function getTotalUSD(){
  const tc = getTc();
  return (caja.cuentas||CUENTAS_DEFAULT).reduce((sum, c)=>{
    const s = getSaldoActual(c.id);
    const val = s?s.monto:0;
    return sum + (c.moneda==='USD'?val:val/tc);
  }, 0);
}

function renderCaja(){
  if(currentCajaTab==='saldos') renderCajaSaldos();
  else if(currentCajaTab==='historial') renderCajaHistorial();
  else renderCajaConfig();
}

function renderCajaSaldos(){
  const tc = getTc();
  const cuentas = caja.cuentas||CUENTAS_DEFAULT;
  const total = getTotalUSD();
  const TIPO_ICON = {caja:'🏦', banco:'🏛', ext:'🌐', otro:'📋'};

  let html = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px">
      <div style="background:var(--surface2);border-radius:var(--radius-sm);padding:10px 18px;display:flex;align-items:baseline;gap:10px">
        <span style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em">Total disponible</span>
        <span style="font-size:22px;font-weight:500;font-family:var(--mono);color:var(--accent)">${fmtUSD(total)}</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:12px;color:var(--muted)">TC USD $</span>

    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px">
  `;

  cuentas.forEach(c=>{
    const s = getSaldoActual(c.id);
    const monto = s?s.monto:null;
    const arsEq = monto!==null ? (c.moneda==='USD'?monto:monto/tc) : null;
    const fechaStr = s ? s.fecha : null;
    const pct = total>0&&arsEq!==null ? Math.round(arsEq/total*100) : 0;

    html += `
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div>
            <div style="font-size:12px;color:var(--muted);margin-bottom:3px">${TIPO_ICON[c.tipo]||'📋'} ${c.tipo.toUpperCase()}</div>
            <div style="font-weight:500;font-size:14px">${c.nombre}</div>
          </div>
          <span class="tag ${c.moneda==='USD'?'tag-usd':'tag-ars'}">${c.moneda}</span>
        </div>
        <div style="font-family:var(--mono);font-size:20px;font-weight:500;color:${monto!==null?'var(--text)':'var(--muted)'}">
          ${monto!==null ? fmtMon(monto,c.moneda) : '— sin saldo —'}
        </div>
        ${c.moneda==='ARS'&&monto!==null?`<div style="font-size:11px;color:var(--muted)">≈ ${fmtUSD(arsEq)}</div>`:''}
        ${fechaStr?`<div style="font-size:11px;color:var(--muted)">Actualizado: ${fechaStr}</div>`:''}
        ${total>0&&arsEq!==null?`
          <div style="background:var(--surface2);border-radius:3px;height:4px;overflow:hidden">
            <div style="height:100%;width:${pct}%;background:var(--accent);border-radius:3px"></div>
          </div>
          <div style="font-size:10px;color:var(--muted)">${pct}% del total</div>
        `:''}
        <button class="btn btn-sm btn-accent" style="margin-top:4px" onclick="openModalSaldo('${c.id}','${c.nombre}')">↑ Actualizar saldo</button>
      </div>
    `;
  });

  html += `</div>`;
  document.getElementById('caja-content').innerHTML = html;
}

function renderCajaHistorial(){
  const cuentas = caja.cuentas||CUENTAS_DEFAULT;
  const hist = (caja.historial||[]).slice().sort((a,b)=>b.fecha.localeCompare(a.fecha)||b.ts-a.ts);
  const cuentaMap = Object.fromEntries(cuentas.map(c=>[c.id,c]));

  let filterHtml = `
    <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center">
      <span style="font-size:12px;color:var(--muted)">Filtrar:</span>
      <select id="hist-filter-cuenta" onchange="renderCajaHistorial()" style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:5px 8px;color:var(--text);font-size:12px;outline:none">
        <option value="">Todas las cuentas</option>
        ${cuentas.map(c=>`<option value="${c.id}">${c.nombre}</option>`).join('')}
      </select>
      <input type="date" id="hist-filter-desde" onchange="renderCajaHistorial()" style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:5px 8px;color:var(--text);font-size:12px;outline:none">
      <input type="date" id="hist-filter-hasta" onchange="renderCajaHistorial()" style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:5px 8px;color:var(--text);font-size:12px;outline:none">
    </div>
  `;

  document.getElementById('caja-content').innerHTML = filterHtml + '<div id="hist-tabla"></div>';

  const filtCuenta = document.getElementById('hist-filter-cuenta').value;
  const filtDesde  = document.getElementById('hist-filter-desde').value;
  const filtHasta  = document.getElementById('hist-filter-hasta').value;

  let filtered = hist;
  if(filtCuenta) filtered = filtered.filter(h=>h.cuentaId===filtCuenta);
  if(filtDesde)  filtered = filtered.filter(h=>h.fecha>=filtDesde);
  if(filtHasta)  filtered = filtered.filter(h=>h.fecha<=filtHasta);

  if(!filtered.length){
    document.getElementById('hist-tabla').innerHTML='<div class="empty"><p>Sin registros para el filtro seleccionado.</p></div>';

  document.getElementById('hist-tabla').innerHTML=`
    <div class="tbl-wrap">

        <thead><tr><th>Fecha</th><th>Cuenta</th><th style="text-align:right">Saldo</th><th>Nota</th><th></th></tr></thead>

          </tr>`;
        }).join('')}</tbody>
      </table>
    </div>
  `;
}

function openModalSaldo(cuentaId, nombre){
  saldoTargetId = cuentaId;
  document.getElementById('modal-saldo-title').textContent = 'Actualizar: '+nombre;
  document.getElementById('ms2-cuenta').value = nombre;
  document.getElementById('ms2-fecha').value = new Date().toISOString().slice(0,10);
  document.getElementById('ms2-monto').value = '';
  document.getElementById('ms2-nota').value = '';
  document.getElementById('ms2-error').style.display='none';
  openModal('modal-saldo');
  setTimeout(()=>document.getElementById('ms2-monto').focus(),100);
}

function guardarSaldo(){
  const fecha = document.getElementById('ms2-fecha').value;
  const monto = parseFloat(document.getElementById('ms2-monto').value);
  const nota  = document.getElementById('ms2-nota').value.trim();
  const errEl = document.getElementById('ms2-error');
  if(!fecha){ errEl.style.display='block'; errEl.textContent='Ingresá la fecha.'; return; }
  if(isNaN(monto)){ errEl.style.display='block'; errEl.textContent='Ingresá un monto válido.'; return; }
  errEl.style.display='none';
  if(!caja.historial) caja.historial=[];
  caja.historial.push({ts:Date.now(), cuentaId:saldoTargetId, fecha, monto, nota});
  save('caja',caja);
  closeModal('modal-saldo');
  renderCajaSaldos();
}

function eliminarSaldo(ts){
  if(!confirm('¿Eliminar este registro?')) return;
  caja.historial = (caja.historial||[]).filter(h=>h.ts!==ts);
  save('caja',caja);
  renderCajaHistorial();
}

function openModalCuenta(id=null){
  editingCuentaId = id;
  const cuentas = caja.cuentas||CUENTAS_DEFAULT;
  const c = id?cuentas.find(x=>x.id===id):null;
  document.getElementById('modal-cuenta-title').textContent = id?'Editar cuenta':'Nueva cuenta';
  document.getElementById('mc-nombre').value = c?c.nombre:'';
  document.getElementById('mc-tipo').value   = c?c.tipo:'banco';
  document.getElementById('mc-moneda').value = c?c.moneda:'ARS';
  document.getElementById('mc-saldo').value  = '';
  document.getElementById('mc-error').style.display='none';
  openModal('modal-cuenta');
}

function guardarCuenta(){
  const nombre = document.getElementById('mc-nombre').value.trim();
  const tipo   = document.getElementById('mc-tipo').value;
  const moneda = document.getElementById('mc-moneda').value;
  const saldoInicial = parseFloat(document.getElementById('mc-saldo').value);
  const errEl = document.getElementById('mc-error');
  if(!nombre){ errEl.style.display='block'; errEl.textContent='Ingresá un nombre.'; return; }
  if(!caja.cuentas) caja.cuentas = [...CUENTAS_DEFAULT];
  const newId = editingCuentaId||'cta-'+Date.now();
  const newC = {id:newId, nombre, tipo, moneda, proyecto:document.getElementById('mc-proy').value};
  if(editingCuentaId) caja.cuentas = caja.cuentas.map(c=>c.id===editingCuentaId?newC:c);
  else caja.cuentas.push(newC);
  if(!isNaN(saldoInicial)&&saldoInicial!==''){
    if(!caja.historial) caja.historial=[];
    caja.historial.push({ts:Date.now(),cuentaId:newId,fecha:new Date().toISOString().slice(0,10),monto:saldoInicial,nota:'Saldo inicial'});
  }
  save('caja',caja);
  closeModal('modal-cuenta'); renderCajaConfig();
}

function eliminarCuenta(id){
  if(!confirm('¿Eliminar esta cuenta? Se borrará también su historial.')) return;
  if(!caja.cuentas) caja.cuentas=[...CUENTAS_DEFAULT];
  caja.cuentas = caja.cuentas.filter(c=>c.id!==id);
  caja.historial = (caja.historial||[]).filter(h=>h.cuentaId!==id);
  save('caja',caja); renderCajaConfig();
}

function egresoTab(t){
  currentEgresoTab=t;
  document.querySelectorAll('.sub-tab[id^="etab"]').forEach(b=>{b.classList.toggle('active',b.id==='etab-'+t)});
  renderEgresos();

function renderEgresos(){
  const el  = document.getElementById('egresos-content');
  const q   = (document.getElementById('search-egresos')||{value:''}).value.trim().toLowerCase();
  const fp  = (document.getElementById('filter-egresos-proy')||{value:''}).value;
  const tc  = caja.tc||1200;

  // When searching/filtering by project across all tabs, show all; otherwise filter by tab
  const crossSearch = q.length>0 || fp;
  let pool = crossSearch ? egresos : egresos.filter(e=>e.cat===currentEgresoTab);
  if(fp) pool = pool.filter(e=>e.proyecto===fp);
  if(q)  pool = pool.filter(e=>{
    const haystack = [e.desc, e.proyecto||'', e.notas||'', EGRESO_CATS[e.cat]||'', ym2label(e.mes)].join(' ').toLowerCase();
    return haystack.includes(q);
  });

  const total = pool.reduce((s,e)=>s+(e.moneda==='USD'?e.monto:(e.monto/tc)),0);
  const countEl = document.getElementById('egresos-count');
  if(countEl) countEl.textContent = pool.length + (crossSearch?' resultados':' en '+EGRESO_CATS[currentEgresoTab]);

  let html = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <span style="font-size:13px;color:var(--muted)">
        ${pool.length} registro${pool.length!==1?'s':''}
        ${crossSearch&&fp?' · Proyecto: <strong style="color:#60d098">'+fp+'</strong>':''}
        ${crossSearch&&q?' · Búsqueda: <strong>"'+q+'"</strong>':''}
      </span>
      <span style="font-size:13px;font-family:var(--mono);color:var(--red)">Total: ${fmtUSD(total)}</span>
    </div>`;

  // Sort
  const se = (document.getElementById('sort-egresos')||{value:'fecha-desc'}).value;
  pool.sort((a,b)=>{
    if(se==='fecha-asc')  return a.mes.localeCompare(b.mes);
    if(se==='fecha-desc') return b.mes.localeCompare(a.mes);
    if(se==='nombre-asc') return (a.desc||'').localeCompare(b.desc||'');
    if(se==='nombre-desc')return (b.desc||'').localeCompare(a.desc||'');
    const va=a.moneda==='USD'?a.monto:a.monto/1200, vb=b.moneda==='USD'?b.monto:b.monto/1200;
    if(se==='monto-asc')  return va-vb;
    if(se==='monto-desc') return vb-va;
    return 0;
  });

  if(!pool.length){
    html += crossSearch
      ? `<div class="empty"><p>Sin resultados para ese criterio de búsqueda.</p></div>`
      : `<div class="empty"><p>Sin egresos en esta categoría.</p></div>`;
    el.innerHTML=html; return;
  }

  html += pool.map(e=>`
    <div class="egreso-card">
      <div class="egreso-top">
        <div>
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <div class="egreso-nombre">${highlight(e.desc,q)}</div>
            ${e.proyecto?`<span class="tag" style="background:${PROY_COLORS[e.proyecto]?'rgba(96,208,152,0.1)':'rgba(255,255,255,0.06)'};color:${PROY_COLORS[e.proyecto]||'#60d098'};font-size:10px">${highlight(e.proyecto,q)}</span>`:''}
            ${crossSearch?`<span class="tag tag-ars" style="font-size:10px">${EGRESO_CATS[e.cat]||e.cat}</span>`:''}
          </div>
          <div class="egreso-meta">${ym2label(e.mes)} · ${e.freq==='unico'?'Pago único':e.freq==='mensual'?'Mensual':'Trimestral'}${e.notas?' · '+highlight(e.notas,q):''}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
          <div class="egreso-monto">${fmtMon(e.monto,e.moneda)}</div>
          <div style="display:flex;gap:4px">
            <button class="btn btn-sm btn-ghost" onclick="editarEgreso(${e.id})">✎</button>
            <button class="btn btn-sm btn-danger" onclick="eliminarEgreso(${e.id})">✕</button>
          </div>
        </div>
      </div>
    </div>
  `).join('');
  el.innerHTML=html;
}

function eliminarEgreso(id){ if(!confirm('¿Eliminar?')) return; egresos=egresos.filter(e=>e.id!==id); save('egresos',egresos); renderEgresos(); updateBadges(); }
function guardarEgreso(){

// ─── CASHFLOW TABLE ──────────────────────────────────────────────────────────
function initCashflow(){
  const hoy=todayYM();
  document.getElementById('cf-desde').value=hoy;
  document.getElementById('cf-hasta').value=addMonths(hoy,11);
  document.getElementById('cf-tc').value=caja.tc||1200;
  renderCashflow();
}
function calcEgresoMY(e,m,tc){
  let act=false;
  if(e.freq==='unico') act=e.mes===m;
  else if(e.freq==='mensual') act=e.mes<=m;
  else if(e.freq==='trimestral'){
    const[ey,em2]=e.mes.split('-').map(Number);
    const[ty,tm]=m.split('-').map(Number);
    const diff=(ty-ey)*12+(tm-em2);
    act=diff>=0&&diff%3===0;
  }
  return act?(e.moneda==='USD'?e.monto:e.monto/tc):0;
}

function renderCashflow(){
  const desde=document.getElementById('cf-desde').value||todayYM();
  const hasta=document.getElementById('cf-hasta').value||addMonths(todayYM(),11);
  const tc=parseFloat(document.getElementById('cf-tc').value)||1200;
  const meses=[];
  let cur=desde;
  while(cur<=hasta && meses.length<24){ meses.push(cur); cur=addMonths(cur,1); }

  const cajaInicial = getTotalUSD();
  const cajaArr     = meses.map(()=>0); // placeholder — shown as saldo inicial fijo

  // ── INGRESOS por proyecto ─────────────────────────────────────────────────
  const oi_mes = meses.map(m=>calcOtrosIngYM(m,tc).total_usd);

  // Ventas agrupadas por proyecto
  const ventasPorProy = {};
  PROYECTOS.forEach(p=>{ ventasPorProy[p]=[]; });
  ventasPorProy['Sin proyecto']=[];
  ventas.forEach(v=>{ (ventasPorProy[v.proyecto||'Sin proyecto']||ventasPorProy['Sin proyecto']).push(v); });

  const rows_ingr_proy = Object.entries(ventasPorProy)
    .filter(([,vs])=>vs.length>0)
    .map(([proy,vs])=>({
      label: proy,
      vals: meses.map(m=>{
        let t=0;
        vs.forEach(v=>v.cuotas.forEach(c=>{
          const[cy,cm2]=c.mes.split('-').map(Number);
          const[ty,tm]=m.split('-').map(Number);
          const diff=(ty-cy)*12+(tm-cm2);
          if(diff>=0&&diff<c.cantidad) t+=(c.moneda==='USD'?c.monto:c.monto/tc);
        }));
        return t;
      }),
      proyecto: proy
    }));

  // Otros ingresos por proyecto
  const otrosIngrPorProy = {};
  PROYECTOS.forEach(p=>{ otrosIngrPorProy[p]=0; });
  const rows_otros_proy = Object.entries(
    otrosIng.reduce((acc,o)=>{
      const p=o.proyecto||'Sin proyecto';
      if(!acc[p]) acc[p]=[];
      acc[p].push(o);
      return acc;
    },{})
  ).map(([proy,items])=>({
    label:'Otros ing. '+proy,
    vals: meses.map(m=>items.reduce((s,o)=>{
      if(!o.desde) return s;
      const[oy,om]=o.desde.split('-').map(Number);
      const[ty,tm]=m.split('-').map(Number);
      const diff=(ty-oy)*12+(tm-om);
      if(diff<0) return s;
      let act=false;
      if(o.tipo==='recurrente') act=!o.hasta||m<=o.hasta;
      else if(o.tipo==='unico') act=diff===0;
      else if(o.tipo==='cuotas') act=diff<(o.ncuotas||1);
      return s+(act?(o.moneda==='USD'?o.monto:o.monto/tc):0);
    },0)),
    proyecto: proy
  })).filter(r=>r.vals.some(v=>v>0));

  const total_cobros = meses.map((_,i)=>
    rows_ingr_proy.reduce((s,r)=>s+r.vals[i],0) +
    rows_otros_proy.reduce((s,r)=>s+r.vals[i],0)
  );

  // ── EGRESOS por proyecto ──────────────────────────────────────────────────
  const rows_egr_proy = PROYECTOS.map(proy=>({
    label: proy,
    vals: meses.map(m=>egresos.filter(e=>e.proyecto===proy).reduce((s,e)=>s+calcEgresoMY(e,m,tc),0))
  })).filter(r=>r.vals.some(v=>v>0));

  // Egresos sin proyecto (generales)
  const rows_egr_gen_cats = Object.keys(EGRESO_CATS).map(cat=>({
    label: EGRESO_CATS[cat],
    vals: meses.map(m=>egresos.filter(e=>!e.proyecto&&e.cat===cat).reduce((s,e)=>s+calcEgresoMY(e,m,tc),0))
  })).filter(r=>r.vals.some(v=>v>0));

  const total_egresos = meses.map((_,i)=>
    rows_egr_proy.reduce((s,r)=>s+r.vals[i],0)+
    rows_egr_gen_cats.reduce((s,r)=>s+r.vals[i],0)
  );

  const flujo_neto = meses.map((_,i)=>total_cobros[i]-total_egresos[i]);

  // Saldo acumulado (parte de caja inicial)
  let saldo = cajaInicial;
  const saldos = flujo_neto.map(f=>{ saldo+=f; return saldo; });

  // ── HTML helpers ──────────────────────────────────────────────────────────
  const nc = meses.length;
  const fv =(n)=>n===0?'—':`<span class="${n>0?'positive':n<0?'negative':''}">${n>0?'+':''}${fmtUSD(n)}</span>`;
  const fvPos=(n)=>n===0?'—':`<span class="positive">${fmtUSD(n)}</span>`;
  const fvNeg=(n)=>n===0?'—':`<span class="negative">${fmtUSD(n)}</span>`;
  const fvSaldo=(n)=>`<span class="${n>=0?'positive':'negative'}" style="font-weight:600">${fmtUSD(n)}</span>`;

  const hdrs=`<tr>
    <th class="cf-sticky" style="min-width:200px">Concepto</th>
    ${meses.map(m=>`<th>${MESES[parseInt(m.split('-')[1])-1]}<br><span style="font-weight:400;font-size:10px">${m.split('-')[0]}</span></th>`).join('')}
    <th>Total</th>
  </tr>`;

  const sectionRow=(label,icon='')=>`<tr class="cf-section-row"><td colspan="${nc+2}">${icon} ${label}</td></tr>`;
  const dataRow=(label,vals,fmtFn,indent=1,color='')=>{
    const pad=indent===2?'padding-left:32px':indent===1?'padding-left:20px':'';
    const colorStyle=color?`color:${color};`:'';
    return `<tr class="cf-sub-row">
      <td style="${pad}${colorStyle}">${label}</td>
      ${vals.map(v=>`<td>${fmtFn(v)}</td>`).join('')}
      <td>${fmtFn(vals.reduce((s,x)=>s+x,0))}</td>
    </tr>`;
  };
  const totalRow=(label,vals,fmtFn)=>`<tr class="cf-total-row">
    <td>${label}</td>
    ${vals.map(v=>`<td>${fmtFn(v)}</td>`).join('')}
    <td>${fmtFn(vals.reduce((s,x)=>s+x,0))}</td>
  </tr>`;
  const netRow=(label,vals)=>`<tr class="cf-net-row">
    <td>${label}</td>
    ${vals.map(v=>`<td>${fv(v)}</td>`).join('')}
    <td>${fv(vals.reduce((s,x)=>s+x,0))}</td>
  </tr>`;
  const saldoRow=(label,vals)=>`<tr class="cf-saldo-row">
    <td><strong>${label}</strong></td>
    ${vals.map(v=>`<td>${fvSaldo(v)}</td>`).join('')}
    <td>—</td>
  </tr>`;
  const staticRow=(label,val)=>`<tr class="cf-sub-row">
    <td style="padding-left:20px">${label}</td>
    ${meses.map(()=>`<td style="color:var(--muted);font-size:11px">—</td>`).join('')}
    <td><span class="positive">${fmtUSD(val)}</span></td>
  </tr>`;

  let tbl=`<thead>${hdrs}</thead><tbody>`;

  // ── INGRESOS ──────────────────────────────────────────────────────────────
  tbl+=sectionRow('INGRESOS','▸');
  tbl+=staticRow('Saldo inicial caja + bancos',cajaInicial);
  rows_ingr_proy.forEach(r=>{
    const col=PROY_COLORS[r.proyecto]||'var(--green)';
    tbl+=dataRow(r.label,r.vals,fvPos,1,col);
  });
  if(rows_otros_proy.length){
    rows_otros_proy.forEach(r=>tbl+=dataRow(r.label,r.vals,fvPos,2));
  }
  tbl+=totalRow('TOTAL INGRESOS (sin caja inicial)',total_cobros,fmtUSD);

  // ── EGRESOS ───────────────────────────────────────────────────────────────
  tbl+=sectionRow('EGRESOS','▸');
  rows_egr_proy.forEach(r=>{
    const col=PROY_COLORS[r.label]||'var(--red)';
    tbl+=dataRow(r.label,r.vals,fvNeg,1,col);
  });
  if(rows_egr_gen_cats.length){
    tbl+=dataRow('Gastos generales',rows_egr_gen_cats.reduce((acc,r)=>acc.map((v,i)=>v+r.vals[i]),meses.map(()=>0)),fvNeg,1);
    rows_egr_gen_cats.forEach(r=>tbl+=dataRow(r.label,r.vals,fvNeg,2));
  }
  tbl+=totalRow('TOTAL EGRESOS',total_egresos,fmtUSD);

  tbl+=netRow('FLUJO NETO DEL PERÍODO',flujo_neto);
  tbl+=saldoRow('SALDO ACUMULADO (caja inicial + flujo)',saldos);
  tbl+='</tbody>';

  document.getElementById('cf-table').innerHTML=tbl;
}

          <td>${o.proyecto?`<span class="tag" style="background:rgba(96,208,152,0.1);color:#60d098;font-size:10px">${o.proyecto}</span>`:'<span style="color:var(--muted)">—</span>'}</td>

            <button class="btn btn-sm btn-ghost" onclick="editarOtroIngreso(${o.id})">✎</button>

function toggleOtroIngFreq(){
  const tipo = document.getElementById('moi-tipo').value;
  document.getElementById('moi-hasta-wrap').style.display   = tipo==='recurrente'?'':'none';
  document.getElementById('moi-ncuotas-wrap').style.display = tipo==='cuotas'?'':'none';
}

function openModalOtroIngreso(id=null){
  editingOtroIngId = id;
  const o = id ? otrosIng.find(x=>x.id===id) : null;
  document.getElementById('modal-otroing-title').textContent = id?'Editar ingreso':'Nuevo ingreso';
  document.getElementById('moi-desc').value    = o?o.desc:'';
  document.getElementById('moi-tipo').value    = o?o.tipo:'recurrente';
  document.getElementById('moi-monto').value   = o?o.monto:'';
  document.getElementById('moi-moneda').value  = o?o.moneda:'USD';
  document.getElementById('moi-desde').value   = o?o.desde:todayYM();
  document.getElementById('moi-hasta').value   = o?o.hasta||'':'';
  document.getElementById('moi-ncuotas').value = o?o.ncuotas||'':'';
  document.getElementById('moi-proy').value    = o?o.proyecto||'':'';
  document.getElementById('moi-notas').value   = o?o.notas||'':'';
  document.getElementById('moi-error').style.display='none';
  toggleOtroIngFreq();
  openModal('modal-otroing');
}

function editarOtroIngreso(id){ openModalOtroIngreso(id); }

function eliminarOtroIngreso(id){
  if(!confirm('¿Eliminar este ingreso?')) return;
  otrosIng = otrosIng.filter(o=>o.id!==id);
  save('otrosIng',otrosIng); renderOtrosIngresos();
}

function guardarOtroIngreso(){
  const desc   = document.getElementById('moi-desc').value.trim();
  const tipo   = document.getElementById('moi-tipo').value;
  const monto  = parseFloat(document.getElementById('moi-monto').value)||0;
  const moneda = document.getElementById('moi-moneda').value;
  const desde  = document.getElementById('moi-desde').value;
  const hasta  = document.getElementById('moi-hasta').value||'';
  const ncuotas= parseInt(document.getElementById('moi-ncuotas').value)||0;
  const proy   = document.getElementById('moi-proy').value;
  const notas  = document.getElementById('moi-notas').value.trim();
  const errEl  = document.getElementById('moi-error');
  if(!desc||!monto||!desde){ errEl.style.display='block'; errEl.textContent='Completá descripción, monto y mes de inicio.'; return; }
  if(tipo==='cuotas'&&ncuotas<1){ errEl.style.display='block'; errEl.textContent='Ingresá la cantidad de cuotas.'; return; }
  errEl.style.display='none';
  const newO = {id:editingOtroIngId||(Date.now()), desc, tipo, monto, moneda, desde, hasta, ncuotas, proyecto:proy, notas};
  if(editingOtroIngId) otrosIng = otrosIng.map(o=>o.id===editingOtroIngId?newO:o);
  else otrosIng.push(newO);
  save('otrosIng',otrosIng);
  closeModal('modal-otroing'); renderOtrosIngresos();
}

function readExcelFile(file, callback){
  const reader = new FileReader();
  reader.onload = function(e){
    try {
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
      callback(null, rows);
    } catch(err){ callback('No se pudo leer el archivo: '+err.message); }
  };
  reader.readAsArrayBuffer(file);
}

function procesarImportObra(){
  const file = document.getElementById('imp-obra-file').files[0];
  const proyecto = document.getElementById('imp-obra-proy').value;
  const cat = document.getElementById('imp-obra-cat').value;
  const msgEl = document.getElementById('imp-obra-msg');
  if(!file){ msgEl.innerHTML='<div class="alert alert-danger">Seleccioná un archivo primero.</div>'; return; }
  if(!proyecto){ msgEl.innerHTML='<div class="alert alert-danger">Seleccioná el proyecto antes de importar.</div>'; return; }
  msgEl.innerHTML='<div style="color:var(--muted);font-size:13px">Procesando...</div>';

  readExcelFile(file, function(err, rows){
    if(err){ msgEl.innerHTML='<div class="alert alert-danger">'+err+'</div>'; return; }
    if(rows.length < 2){ msgEl.innerHTML='<div class="alert alert-danger">El archivo no tiene datos suficientes.</div>'; return; }

    const headers = rows[0];
    // Col 0=Categoria, 1=Moneda, 2+= meses
    const mesesCols = headers.slice(2).map(h=>String(h).trim());
    const errores = [];
    const importados = [];
    let previewRows = [];

    rows.slice(1).forEach((row, ri)=>{
      const catLabel = String(row[0]||'').trim();
      const moneda = String(row[1]||'ARS').trim().toUpperCase();
      if(!catLabel) return;
      if(moneda!=='ARS'&&moneda!=='USD'){ errores.push('Fila '+(ri+2)+': moneda inválida "'+moneda+'" — usá ARS o USD'); return; }

      mesesCols.forEach((mes, ci)=>{
        const raw = row[ci+2];
        const monto = parseFloat(String(raw).replace(/[^0-9.-]/g,''))||0;
        if(monto <= 0) return;
        // Validate mes format YYYY-MM
        if(!/^\d{4}-\d{2}$/.test(mes)){ errores.push('Encabezado de columna inválido: "'+mes+'" — debe ser YYYY-MM (ej: 2025-01)'); return; }
        importados.push({id:Date.now()+Math.random(),proyecto,desc:catLabel,cat,monto,moneda,mes,freq:'unico',notas:'Importado'});
        previewRows.push({catLabel,moneda,mes,monto});
      });
    });

    if(errores.length){
      msgEl.innerHTML='<div class="alert alert-danger">'+errores.slice(0,5).join('<br>')+'</div>'; return;
    }
    if(!importados.length){ msgEl.innerHTML='<div class="alert alert-danger">No se encontraron datos válidos. Verificá el formato.</div>'; return; }

    // Show preview
    const preview = document.getElementById('imp-obra-preview');
    preview.innerHTML = `
      <div class="section-hdr"><span class="section-title">Vista previa — ${importados.length} registros</span></div>
      <div class="tbl-wrap" style="max-height:280px;overflow-y:auto">
        <table>
          <thead><tr><th>Proyecto</th><th>Categoría</th><th>Mes</th><th style="text-align:right">Monto</th><th>Moneda</th></tr></thead>
          <tbody>${previewRows.slice(0,50).map(r=>`<tr><td><span class="tag" style="background:rgba(96,208,152,0.1);color:#60d098;font-size:10px">${proyecto}</span></td><td>${r.catLabel}</td><td>${ym2label(r.mes)}</td><td>${fmtN(r.monto)}</td><td><span class="tag ${r.moneda==='USD'?'tag-usd':'tag-ars'}">${r.moneda}</span></td></tr>`).join('')}</tbody>
        </table>
      </div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="btn btn-accent" onclick="confirmarImportObra(${JSON.stringify(importados).split('"').join('&quot;')})">✓ Confirmar e importar ${importados.length} registros</button>
        <button class="btn" onclick="document.getElementById('imp-obra-preview').innerHTML=''">Cancelar</button>
      </div>
    `;
    msgEl.innerHTML='';
  });
}

function confirmarImportObra(importados){
  egresos = egresos.concat(importados);
  save('egresos', egresos);

  document.getElementById('imp-obra-preview').innerHTML='';
  document.getElementById('imp-obra-msg').innerHTML='<div class="alert alert-success">✓ Se importaron '+importados.length+' registros correctamente.</div>';
